add_passcode:
  name: Add Passcode
  description: Adds a new passcode (PIN code) to the Sesame Touch keypad.
  fields:
    device_id:
      name: Keypad or Lock (Device or Entity)
      description: The Sesame Touch keypad or paired lock (Device ID, or Entity ID such as lock.* or sensor.*_registered_passcodes).
      required: false
      example: "lock.entry_currawang_entry"
      selector:
        text:
    entity_id:
      name: Target Entity
      description: Optional entity ID of the keypad or paired lock.
      required: false
      selector:
        entity:
          integration: sesame_ble
    passcode:
      name: Passcode PIN
      description: The passcode digits (between 4 and 16 digits, containing only numbers 0-9).
      required: true
      example: "123456"
      selector:
        text:
    name:
      name: Name / Nickname
      description: The nickname to identify this passcode (maximum 20 characters).
      required: true
      example: "Family Member"
      selector:
        text:
    start:
      name: Start Datetime
      description: "The date and time when the passcode becomes active (e.g. YYYY-MM-DD HH:MM)."
      required: false
      example: "2026-06-20 08:00"
      selector:
        text:
    end:
      name: End Datetime
      description: "The date and time when the passcode expires (e.g. YYYY-MM-DD HH:MM)."
      required: false
      example: "2026-06-20 18:00"
      selector:
        text:
    days:
      name: Days of Week
      description: List of weekdays the passcode is active. Monday is 0, Sunday is 6.
      required: false
      selector:
        select:
          multiple: true
          options:
            - value: "0"
              label: "Monday"
            - value: "1"
              label: "Tuesday"
            - value: "2"
              label: "Wednesday"
            - value: "3"
              label: "Thursday"
            - value: "4"
              label: "Friday"
            - value: "5"
              label: "Saturday"
            - value: "6"
              label: "Sunday"
    time_start:
      name: Daily Start Time
      description: "Daily start time constraint (e.g. HH:MM)."
      required: false
      example: "09:00"
      selector:
        text:
    time_end:
      name: Daily End Time
      description: "Daily end time constraint (e.g. HH:MM)."
      required: false
      example: "17:00"
      selector:
        text:
    one_time:
      name: One-Time Passcode (OTP)
      description: If enabled, the passcode is deleted automatically after one successful unlock.
      required: false
      selector:
        boolean:
    person_id:
      name: Person Entity
      description: Optional person entity to associate with this passcode.
      required: false
      selector:
        entity:
          domain: person


delete_passcode:
  name: Delete Passcode
  description: Deletes an existing passcode (PIN code) from the Sesame Touch keypad.
  fields:
    device_id:
      name: Keypad or Lock (Device or Entity)
      description: The Sesame Touch keypad or paired lock (Device ID, or Entity ID such as lock.* or sensor.*_registered_passcodes).
      required: false
      example: "lock.entry_currawang_entry"
      selector:
        text:
    entity_id:
      name: Target Entity
      description: Optional entity ID of the keypad or paired lock.
      required: false
      selector:
        entity:
          integration: sesame_ble
    passcode_or_id:
      name: Passcode PIN or Hex ID
      description: The passcode digits (e.g. "123456") or the unique hex ID of the passcode to delete (e.g. "010203040506").
      required: true
      example: "123456"
      selector:
        text:

update_passcode:
  name: Update Passcode Name
  description: Updates the nickname of an existing passcode on the Sesame Touch keypad.
  fields:
    device_id:
      name: Keypad or Lock (Device or Entity)
      description: The Sesame Touch keypad or paired lock (Device ID, or Entity ID such as lock.* or sensor.*_registered_passcodes).
      required: false
      example: "lock.entry_currawang_entry"
      selector:
        text:
    entity_id:
      name: Target Entity
      description: Optional entity ID of the keypad or paired lock.
      required: false
      selector:
        entity:
          integration: sesame_ble
    passcode_or_id:
      name: Passcode PIN or Hex ID
      description: The passcode digits or the unique hex ID of the passcode to update.
      required: true
      example: "123456"
      selector:
        text:
    name:
      name: New Name
      description: The new nickname for the passcode (maximum 20 characters).
      required: true
      example: "New Nickname"
      selector:
        text:

pair_lock:
  name: Pair Lock
  description: Pairs a Sesame Lock to the Sesame Touch keypad.
  fields:
    device_id:
      name: Keypad (Device or Entity)
      description: The Sesame Touch keypad device ID or entity ID.
      required: true
      selector:
        text:
    lock_device_id:
      name: Lock (Device or Entity)
      description: The Sesame Lock device ID or entity ID configured in Home Assistant to pair.
      required: true
      selector:
        text:

unpair_lock:
  name: Unpair Lock
  description: Unpairs a Sesame Lock from the Sesame Touch keypad.
  fields:
    device_id:
      name: Keypad (Device or Entity)
      description: The Sesame Touch keypad device ID or entity ID.
      required: true
      selector:
        text:
    lock_uuid:
      name: Lock UUID
      description: The UUID of the Sesame Lock to unpair (e.g. "01234567-89ab-cdef-0123-456789abcdef").
      required: true
      example: "01234567-89ab-cdef-0123-456789abcdef"
      selector:
        text:
